apiVersion: 1
prune: true

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST

  - name: Xray-API
    uid: xray-api
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: http://127.0.0.1:9101
    editable: false
    jsonData:
      allowedHosts:
        - http://127.0.0.1:9101
