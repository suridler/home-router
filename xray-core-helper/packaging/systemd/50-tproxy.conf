[Unit]
After=systemd-sysctl.service nftables.service

[Service]
# Independent native lifecycle. Never invoke the helper control plane here.
ExecStartPre=+/usr/local/libexec/xray-tproxy/network xray-stop
ExecStartPost=+/usr/local/libexec/xray-tproxy/network xray-start
ExecStop=+/usr/local/libexec/xray-tproxy/network xray-stop
ExecStopPost=+/usr/local/libexec/xray-tproxy/network xray-stop
