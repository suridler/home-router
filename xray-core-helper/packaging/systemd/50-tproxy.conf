[Unit]
Wants=systemd-sysctl.service nftables.service
After=systemd-sysctl.service nftables.service

[Service]
# Keep policy routing tied to Xray without depending on helper.
ExecStartPre=+/usr/bin/systemctl stop xray-tproxy-routing.service
ExecStartPost=+/usr/bin/systemctl start xray-tproxy-routing.service
ExecStop=+/usr/bin/systemctl stop xray-tproxy-routing.service
ExecStopPost=+/usr/bin/systemctl stop xray-tproxy-routing.service
